<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">KMS — Kumbakonam Metal Stores</title>
  <desc id="desc">Red KMS lettering inside a yellow circle with a red outline.</desc>
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#FFD83D"/>
      <stop offset="0.58" stop-color="#FFC90D"/>
      <stop offset="1" stop-color="#F8B900"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D71927"/>
      <stop offset="0.56" stop-color="#C8202D"/>
      <stop offset="1" stop-color="#A61926"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="239" fill="url(#yellow)" stroke="url(#red)" stroke-width="16"/>
  <text x="256" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="138" font-weight="800" letter-spacing="-5" fill="#C8202D">KMS</text>
</svg>
